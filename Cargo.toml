[package]
name = "restui"
version = "0.1.1"
edition = "2024"
authors = ["Will Yuan"]
description = "A TUI REST client"
license = "MIT"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
# rustls (static TLS, clean cross-compile) instead of native-tls. Trust anchors
# come from rustls-platform-verifier, which delegates chain evaluation to the OS
# so MDM-installed roots without a trust-settings record are honored.
# http2/charset/system-proxy restore reqwest defaults lost to
# default-features = false.
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "http2",
    "charset",
    "system-proxy",
    "rustls-tls-manual-roots",
] }
# Must stay semver-compatible with reqwest's internal rustls (0.23.x) or the
# use_preconfigured_tls downcast to Option<rustls::ClientConfig> fails silently.
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
rustls-platform-verifier = "0.7"
serde_json = "1"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["rt", "macros"] }

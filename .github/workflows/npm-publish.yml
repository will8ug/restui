name: npm-publish

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to npm via trusted publishing (OIDC). false = build and stage only (bootstrap mode).'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: aarch64-apple-darwin
            runs-on: macos-15
            expected-arch: arm64
          - triple: x86_64-apple-darwin
            runs-on: macos-15
            expected-arch: x86_64
          - triple: x86_64-unknown-linux-gnu
            runs-on: ubuntu-latest
            zigbuild: true
            expected-arch: x86-64
    runs-on: ${{ matrix.runs-on }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "10.12" # rustls floor; no-op on linux
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.triple }}
      - uses: actions/setup-python@v6
        if: matrix.zigbuild
        with:
          python-version: "3.13"
      - name: Install cargo-zigbuild
        if: matrix.zigbuild
        run: |
          pip install ziglang==0.14.1
          cargo install cargo-zigbuild --locked
      - name: Build (zigbuild, glibc 2.17 floor)
        if: matrix.zigbuild
        run: cargo zigbuild --release --target x86_64-unknown-linux-gnu.2.17
      - name: Assert glibc floor
        if: matrix.zigbuild
        run: |
          max="$(objdump -T target/x86_64-unknown-linux-gnu/release/restui \
                | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -n1)"
          [ "$max" = "GLIBC_2.17" ] || { echo "::error::max glibc symbol ref is $max, expected 2.17"; exit 1; }
          echo "glibc floor verified: $max"
      - name: Build
        if: ${{ !matrix.zigbuild }}
        run: cargo build --release --target ${{ matrix.triple }}
      - name: Verify binary
        run: |
          file target/${{ matrix.triple }}/release/restui
          file target/${{ matrix.triple }}/release/restui | grep -q "${{ matrix.expected-arch }}" \
            || { echo "::error::unexpected architecture for ${{ matrix.triple }}"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.triple }}
          path: target/${{ matrix.triple }}/release/restui
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v7
        with:
          name: aarch64-apple-darwin
          path: artifacts/aarch64-apple-darwin
      - uses: actions/download-artifact@v7
        with:
          name: x86_64-apple-darwin
          path: artifacts/x86_64-apple-darwin
      - uses: actions/download-artifact@v7
        with:
          name: x86_64-unknown-linux-gnu
          path: artifacts/x86_64-unknown-linux-gnu
      - name: Stage package tests
        run: node --test 'npm/scripts/*.test.mjs'
      - name: Stage packages
        run: node npm/scripts/stage.mjs --binaries-dir artifacts
      - name: Publish (platforms first, main last, skip existing)
        if: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./target/npm/restui/package.json').version")
          packages=(@will8ug/restui-darwin-arm64 @will8ug/restui-darwin-x64 @will8ug/restui-linux-x64-gnu @will8ug/restui)
          published=0
          for name in "${packages[@]}"; do
            dir="target/npm/${name##*/}"
            if npm view "$name@$VERSION" --loglevel=error >/dev/null 2>&1; then
              echo "::notice::$name@$VERSION already published — skipping"
              continue
            fi
            (cd "$dir" && npm publish --access public --provenance)
            echo "published $name@$VERSION"
            published=$((published + 1))
          done
          if [ "$published" -eq 0 ]; then
            echo "::error::All packages at version $VERSION are already published. Bump version in Cargo.toml and re-run."
            exit 1
          fi
          echo "Done: published $published package(s) at $VERSION"

      - name: Upload staged packages (bootstrap mode)
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@v7
        with:
          name: staged-packages
          path: target/npm/
          if-no-files-found: error
